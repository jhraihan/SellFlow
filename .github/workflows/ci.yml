name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Run ruff
        working-directory: backend
        run: ruff check .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run migrations check
        working-directory: backend
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "True"
          FIELD_ENCRYPTION_KEY: U6NqWrNpqJTlkZYNLyRChEF0LqxQPoIZIfq5sWqfGTo=
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "True"
          FIELD_ENCRYPTION_KEY: U6NqWrNpqJTlkZYNLyRChEF0LqxQPoIZIfq5sWqfGTo=
        run: pytest -q

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sellflow
          POSTGRES_PASSWORD: sellflow
          POSTGRES_DB: sellflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "True"
          FIELD_ENCRYPTION_KEY: U6NqWrNpqJTlkZYNLyRChEF0LqxQPoIZIfq5sWqfGTo=
          DATABASE_URL: postgresql://sellflow:sellflow@localhost:5432/sellflow_test
        run: pytest -q

      - name: Verify concurrency suite actually ran
        working-directory: backend
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "True"
          FIELD_ENCRYPTION_KEY: U6NqWrNpqJTlkZYNLyRChEF0LqxQPoIZIfq5sWqfGTo=
          DATABASE_URL: postgresql://sellflow:sellflow@localhost:5432/sellflow_test
        run: |
          output=$(pytest tests/test_concurrency.py -q 2>&1)
          echo "$output"
          if echo "$output" | grep -q "skipped"; then
            echo "::error::Concurrency tests were skipped. Stock locking is unverified."
            exit 1
          fi
