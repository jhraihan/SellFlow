name: Scheduled jobs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    name: Sync tracking and scan alerts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ secrets.SELLFLOW_API_URL }}
      CRON_SECRET: ${{ secrets.SELLFLOW_CRON_SECRET }}
    steps:
      - name: Skip when not configured
        if: env.API_URL == '' || env.CRON_SECRET == ''
        run: echo "SELLFLOW_API_URL or SELLFLOW_CRON_SECRET is not set. Nothing to do."

      - name: Call the jobs endpoint
        if: env.API_URL != '' && env.CRON_SECRET != ''
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 20 --retry-all-errors \
            --max-time 120 \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "${API_URL%/}/api/v1/internal/jobs/run/"
